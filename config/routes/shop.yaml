# Under /{_locale}/account: the Sylius shop access control requires a signed-in customer.
tmonier_company_insights_shop_insights:
    path: /account/company/insights
    methods: [GET]
    defaults:
        _controller: tmonier_company_insights.controller.shop.insights::showAction

# "See all" of a ranking: buyers, products or categories (allow-list), paginated.
tmonier_company_insights_shop_ranking:
    path: /account/company/insights/{ranking}
    methods: [GET]
    requirements:
        ranking: 'buyers|products|categories'
    defaults:
        _controller: tmonier_company_insights.controller.shop.insights::rankingAction

# CSV export of the order lines of the selection (same permission as the dashboard, same filters, 24 months and 50 000 lines at most).
tmonier_company_insights_shop_export:
    path: /account/company/insights/export
    methods: [GET]
    defaults:
        _controller: tmonier_company_insights.controller.shop.insights::exportAction
